name: pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/build-docs-site.mjs"
      - "scripts/docs-site-assets.mjs"
      - "scripts/bun-canary.sh"
      - "scripts/install-bun-canary.sh"
      - "toolchains/bun-canary.conf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DO_NOT_TRACK: "1"

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache exact Bun canary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/bun
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/bun-canary.conf') }}

      - name: Install exact Bun canary
        run: ./scripts/install-bun-canary.sh

      - name: Build docs site
        run: ./scripts/bun-canary.sh scripts/build-docs-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/docs-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
