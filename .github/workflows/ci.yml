name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  BIRDCLAW_BACKUP_AUTO_SYNC: "0"
  BIRDCLAW_DISABLE_LIVE_WRITES: "1"
  DO_NOT_TRACK: "1"

jobs:
  bun-primary:
    name: Bun primary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache exact Bun canary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/bun
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/bun-canary.conf') }}

      - name: Install exact Bun canary
        run: ./scripts/install-bun-canary.sh

      - name: Install dependencies
        run: ./scripts/bun-canary.sh install --frozen-lockfile

      - name: Verify toolchain and lifecycle trust
        run: |
          ./scripts/bun-canary.sh scripts/verify-bun-canary.mjs
          ./scripts/bun-canary.sh pm untrusted

      - name: Format, lint, and type checks
        run: ./scripts/bun-canary.sh run --bun check

      - name: Unit tests with Istanbul coverage
        run: ./scripts/bun-canary.sh run --bun coverage

      - name: Build
        run: ./scripts/bun-canary.sh run --bun build

      - name: Runtime performance harness smoke
        run: |
          PERF_HOME="$(mktemp -d)"
          BUN_BIN="$(./scripts/install-bun-canary.sh)"
          BIRDCLAW_HOME="$PERF_HOME" ./scripts/bun-canary.sh src/cli.ts --json init --demo >/dev/null
          ./scripts/bun-canary.sh scripts/runtime-perf.mjs \
            --label=ci-bun \
            --runtime="$BUN_BIN" \
            --runtime-arg=--no-env-file \
            --entry=bin/birdclaw.mjs \
            --home="$PERF_HOME" \
            --iterations=1 > runtime-perf-smoke.json
          rm -rf "$PERF_HOME"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bun-coverage
          path: |
            coverage/
            runtime-perf-smoke.json
          if-no-files-found: ignore
          retention-days: 7

  node-compatibility:
    name: Node 26 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache exact Bun canary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/bun
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/bun-canary.conf') }}

      - name: Install exact Bun canary
        run: ./scripts/install-bun-canary.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies from Bun lockfile
        run: ./scripts/bun-canary.sh install --frozen-lockfile

      - name: Node unit tests with V8 coverage
        run: ./scripts/bun-canary.sh run coverage:node

      - name: Node build
        run: ./scripts/bun-canary.sh run build:node

  package:
    name: npm package under Node and Bun
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache exact Bun canary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/bun
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/bun-canary.conf') }}

      - name: Install exact Bun canary
        run: ./scripts/install-bun-canary.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies from Bun lockfile
        run: ./scripts/bun-canary.sh install --frozen-lockfile

      - name: Installed package smoke
        run: |
          BIRDCLAW_NODE_BIN="$(command -v node)" ./scripts/bun-canary.sh scripts/package-smoke.mjs --json > package-smoke.json
          mkdir -p package-artifacts
          ./scripts/bun-canary.sh pm pack --ignore-scripts --destination package-artifacts

      - name: Upload package proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-smoke
          path: |
            package-smoke.json
            package-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright on Bun production server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache exact Bun canary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/bun
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/bun-canary.conf') }}

      - name: Install exact Bun canary
        run: ./scripts/install-bun-canary.sh

      - name: Install dependencies
        run: ./scripts/bun-canary.sh install --frozen-lockfile

      - name: Install Playwright browsers
        run: ./scripts/bun-canary.sh ./node_modules/@playwright/test/cli.js install chromium --with-deps

      - name: End-to-end tests
        run: ./scripts/bun-canary.sh run --bun e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
